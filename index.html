<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiểm Tra Outlook &amp; Office 365</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --paper:#F6F4EC; --panel:#FFFFFF; --ink:#20261F; --ink-muted:#63695F;
    --line:#DCD8CB; --navy:#12224F; --navy-deep:#0B1936; --gold:#E7A33E; --gold-deep:#B97E22;
    --good:#3F7D58; --good-soft:#EAF5EE; --bad:#B14A2C; --bad-soft:#FBEDE7;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    line-height:1.55;
  }
  .page{max-width:720px;margin:0 auto;padding:44px 20px 90px;}
  h1{font-family:'Playfair Display',Georgia,serif;font-weight:700;color:var(--navy);margin:0 0 8px;font-size:28px;}
  h2{font-family:'Playfair Display',Georgia,serif;font-weight:600;color:var(--navy);margin:0 0 6px;font-size:20px;}
  .kicker{color:var(--ink-muted);font-size:13.5px;letter-spacing:.3px;margin:0 0 6px;}
  .lede{color:var(--ink-muted);font-size:15px;max-width:56ch;margin-bottom:26px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:26px;margin-bottom:18px;}
  label{display:block;font-size:13px;color:var(--ink-muted);margin-bottom:6px;}
  input[type=text]{
    width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:8px;
    font-size:15px;background:var(--paper);color:var(--ink);margin-bottom:16px;font-family:inherit;
  }
  input:focus,button:focus{outline:2px solid var(--navy);outline-offset:1px;}
  button{font-family:inherit;font-size:15px;cursor:pointer;border:none;border-radius:8px;padding:12px 22px;}
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-primary:hover{background:var(--navy-deep);}
  .btn-primary:disabled{background:#B9BEC6;cursor:not-allowed;}
  .btn-gold{background:var(--gold);color:#4A3410;font-weight:600;}
  .btn-gold:hover{background:var(--gold-deep);color:#fff;}
  .btn-ghost{background:transparent;color:var(--navy);border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--navy);}

  .progress-wrap{position:sticky;top:0;background:var(--paper);padding:10px 0 14px;z-index:5;}
  .progress-track{height:7px;background:var(--line);border-radius:99px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--gold);transition:width .25s ease;}
  .progress-label{font-size:12.5px;color:var(--ink-muted);margin-top:6px;text-align:right;}

  .q-block{margin-bottom:26px;padding-bottom:22px;border-bottom:1px solid var(--line);}
  .q-block:last-child{border-bottom:none;}
  .q-num{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:99px;
    background:var(--navy);color:#fff;font-size:12px;margin-right:8px;}
  .q-text{font-size:15px;font-weight:600;margin-bottom:12px;}
  .q-opt{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border:1px solid var(--line);
    border-radius:8px;margin-bottom:8px;cursor:pointer;font-size:14.5px;}
  .q-opt:hover{border-color:var(--navy);}
  .q-opt.selected{border-color:var(--navy);background:#EEF1F8;}
  .q-opt input{margin-top:2px;accent-color:var(--navy);}

  .footer-nav{display:flex;justify-content:flex-end;gap:10px;margin-top:6px;}
  .result-score{font-family:'Playfair Display',serif;font-size:46px;color:var(--navy);margin:6px 0 2px;}
  .badge{display:inline-block;font-size:13px;padding:4px 14px;border-radius:99px;font-weight:600;}
  .badge.pass{background:var(--good-soft);color:var(--good);border:1px solid var(--good);}
  .badge.fail{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad);}

  /* ---------- certificate ---------- */
  .cert-outer{width:100%; max-width:900px; margin:22px auto; position:relative; aspect-ratio:900/636; overflow:hidden;}
  .certificate{
    position:absolute; top:0; left:0; width:900px; height:636px; background:#fff;
    font-family:'Inter',sans-serif; overflow:hidden; border-radius:4px; transform-origin:top left;
  }
  .cert-border{position:absolute; inset:34px 34px 34px 34px; border:1.5px solid var(--navy); pointer-events:none;}
  .cert-border-inner{position:absolute; left:34px; top:34px; width:330px; height:260px; border-right:none; border-bottom:none;}
  .cert-svg{position:absolute; inset:0; width:900px; height:636px;}
  .cert-content{position:relative; z-index:2; padding:56px 0 0 68px; width:520px;}
  .cert-logo{height:34px; margin-bottom:18px; display:block;}
  .cert-kicker{font-family:'Playfair Display',serif; font-size:44px; font-weight:700; color:var(--navy); letter-spacing:2px; margin:0;}
  .cert-sub{font-size:13px; letter-spacing:3px; color:var(--navy); font-weight:600; margin-top:2px;}
  .cert-name{font-family:'Great Vibes',cursive; font-size:56px; color:var(--navy); margin:26px 0 6px; line-height:1;}
  .cert-desc{font-size:13px; color:#2B2B2B; font-weight:600; max-width:420px; line-height:1.6;}
  .cert-meta-row{display:flex; gap:60px; margin-top:60px; padding-top:14px;}
  .cert-meta{border-top:1.3px solid var(--navy); padding-top:8px; min-width:150px;}
  .cert-meta .lbl{font-size:11px; letter-spacing:1.5px; color:var(--navy); font-weight:600;}
  .cert-meta .val{font-size:14px; color:var(--ink); margin-top:2px;}
  .cert-seal{
    position:absolute; right:96px; bottom:66px; width:108px; height:108px; border-radius:99px;
    background:radial-gradient(circle at 35% 30%, #FCE7B8, var(--gold) 55%, var(--gold-deep) 100%);
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    box-shadow:0 4px 14px rgba(0,0,0,.25); z-index:3; border:2px dashed rgba(255,255,255,.55);
  }
  .cert-seal .ic{font-size:28px; color:#fff;}
  .cert-seal .txt{font-size:8px; color:#fff; font-weight:700; letter-spacing:.5px; text-align:center; margin-top:2px; line-height:1.2;}
  .cert-ribbon{position:absolute; right:120px; bottom:26px; width:60px; height:46px; z-index:2;}
  .cert-ribbon .tri{
    position:absolute; top:0; width:0; height:0;
    border-left:14px solid transparent; border-right:14px solid transparent;
  }
  .cert-ribbon .tri-l{ left:0; border-top:40px solid var(--navy); transform:rotate(8deg); }
  .cert-ribbon .tri-r{ right:0; border-top:40px solid var(--navy-deep); transform:rotate(-8deg); }

  .cert-note{font-size:12px; color:var(--ink-muted); text-align:center; margin-top:6px;}
  .notice{font-size:12.5px;color:var(--ink-muted);border-top:1px solid var(--line);margin-top:22px;padding-top:14px;}

  @media (max-width:480px){
    .page{padding:28px 14px 60px;}
    h1{font-size:23px;}
    .result-score{font-size:36px;}
  }
</style>
</head>

const PASS_THRESHOLD = 21;

/* Dán URL Web App Google Apps Script của bạn vào đây (xem hướng dẫn kèm theo).
   Để trống ("") thì app vẫn chạy quiz + chứng chỉ bình thường, chỉ không gửi/xem được kết quả tập trung. */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwNJ7JMkT2QTHM0fG4RPWx_V1qDLG96qqVzPUVoYrMvVbV8EVaOuJBuAHvhRwvLeWr0Hw/exec";
const ADMIN_PIN = "2026";

/* ================= STATE ================= */
const app = document.getElementById("app");
let state = { view:"start", name:"", dept:"", answers:{}, adminData:null, adminError:null };
function setState(patch){ state = {...state, ...patch}; render(); }
function el(html){ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

function score(){ return QUIZ.reduce((n,q,i)=> n + (state.answers[i]===q.correct?1:0), 0); }
function todayStr(){
  const d = new Date();
  return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear();
}

function submitResult(name, dept, sc, passed){
  if (!SCRIPT_URL) return;
  fetch(SCRIPT_URL, {
    method:"POST",
    headers:{ "Content-Type":"text/plain;charset=utf-8" }, // tránh preflight CORS với Apps Script
    body: JSON.stringify({ name, dept, score:sc, total:QUIZ.length, passed, time:new Date().toISOString() }),
  }).catch(() => { /* gửi ngầm, lỗi mạng không chặn trải nghiệm người làm bài */ });
}

async function fetchAdminData(){
  setState({ adminError:null });
  if (!SCRIPT_URL){
    setState({ view:"admin", adminData:[], adminError:"Chưa cấu hình SCRIPT_URL trong file index.html nên chưa có dữ liệu tập trung." });
    return;
  }
  try{
    const res = await fetch(SCRIPT_URL);
    const data = await res.json();
    data.sort((a,b) => (b.time||"").localeCompare(a.time||""));
    setState({ view:"admin", adminData:data });
  }catch(e){
    setState({ view:"admin", adminData:[], adminError:"Không tải được dữ liệu. Kiểm tra lại SCRIPT_URL hoặc thử lại sau." });
  }
}

function render(){
  app.innerHTML = "";
  const views = { start:renderStart, quiz:renderQuiz, result:renderResult, adminPin:renderAdminPin, admin:renderAdmin };
  app.appendChild(views[state.view]());
}

/* ---------- start ---------- */
function renderStart(){
  const wrap = el(`
    <div>
      <div style="display:flex;justify-content:flex-end;margin-bottom:6px;">
        <button class="btn-ghost" id="admin-link" style="padding:6px 12px;font-size:12.5px;">Xem admin</button>
      </div>
      <p class="kicker">BÀI KIỂM TRA SAU ĐÀO TẠO</p>
      <h1>Outlook &amp; Office 365 — Kiểm Tra Kiến Thức</h1>
      <p class="lede">30 câu hỏi trắc nghiệm, mỗi câu 4 đáp án. Trả lời đúng từ 21/30 câu trở lên để đạt và nhận chứng chỉ hoàn thành.</p>
      <div class="card">
        <label for="in-name">Họ và tên</label>
        <input type="text" id="in-name" placeholder="VD: Nguyễn Văn A" value="${esc(state.name)}">
        <label for="in-dept">Phòng ban</label>
        <input type="text" id="in-dept" placeholder="VD: Kinh doanh" value="${esc(state.dept)}">
        <button class="btn-primary" id="start-btn">Bắt đầu làm bài</button>
      </div>
      <p class="notice">Kết quả (họ tên, phòng ban, điểm số) được gửi về cho bộ phận IT để theo dõi tiến độ đào tạo.</p>
    </div>
  `);
  wrap.querySelector("#admin-link").onclick = () => setState({ view:"adminPin" });
  wrap.querySelector("#start-btn").onclick = () => {
    const name = wrap.querySelector("#in-name").value.trim();
    const dept = wrap.querySelector("#in-dept").value.trim();
    if (!name){ wrap.querySelector("#in-name").focus(); return; }
    if (!dept){ wrap.querySelector("#in-dept").focus(); return; }
    setState({ name, dept, view:"quiz" });
  };
  return wrap;
}

/* ---------- quiz ---------- */
function renderQuiz(){
  const answeredCount = Object.keys(state.answers).length;
  const pct = Math.round(answeredCount/QUIZ.length*100);
  const wrap = el(`
    <div>
      <div class="progress-wrap">
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="progress-label">Đã trả lời ${answeredCount}/${QUIZ.length} câu</div>
      </div>
      <h1 style="margin-top:10px;">Bài kiểm tra</h1>
      <p class="lede">Chọn 1 đáp án đúng cho mỗi câu, sau đó nộp bài ở cuối trang.</p>
      <div class="card" id="q-list"></div>
      <div class="footer-nav">
        <button class="btn-primary" id="submit-btn">Nộp bài</button>
      </div>
    </div>
  `);
  const list = wrap.querySelector("#q-list");
  QUIZ.forEach((q, qi) => {
    const block = el(`<div class="q-block"></div>`);
    block.appendChild(el(`<div class="q-text"><span class="q-num">${qi+1}</span>${esc(q.q)}</div>`));
    q.opts.forEach((opt, oi) => {
      const selected = state.answers[qi]===oi;
      const optEl = el(`<label class="q-opt ${selected?"selected":""}"><input type="radio" name="q${qi}" ${selected?"checked":""}><span>${esc(opt)}</span></label>`);
      optEl.querySelector("input").onchange = () => setState({ answers:{...state.answers,[qi]:oi} });
      block.appendChild(optEl);
    });
    list.appendChild(block);
  });
  wrap.querySelector("#submit-btn").onclick = () => {
    if (Object.keys(state.answers).length < QUIZ.length){
      alert("Bạn còn câu chưa trả lời — vui lòng trả lời hết trước khi nộp bài.");
      return;
    }
    const sc = score();
    submitResult(state.name, state.dept, sc, sc >= PASS_THRESHOLD);
    setState({ view:"result" });
    window.scrollTo({top:0, behavior:"smooth"});
  };
  return wrap;
}

/* ---------- admin ---------- */
function renderAdminPin(){
  const wrap = el(`
    <div class="pin-gate" style="max-width:320px;margin:80px auto;text-align:center;">
      <h2>Khu vực Admin</h2>
      <p class="lede" style="margin:0 auto 18px;">Nhập mã để xem kết quả của mọi người.</p>
      <input type="text" id="pin-input" placeholder="Mã PIN" style="text-align:center;">
      <button class="btn-primary" id="pin-submit" style="width:100%;">Xem kết quả</button>
      <div style="margin-top:14px;"><button class="btn-ghost" id="pin-back" style="border:none;text-decoration:underline;">Quay lại</button></div>
    </div>
  `);
  wrap.querySelector("#pin-submit").onclick = async () => {
    const val = wrap.querySelector("#pin-input").value.trim();
    if (val !== ADMIN_PIN){ alert("Mã PIN không đúng."); return; }
    await fetchAdminData();
  };
  wrap.querySelector("#pin-back").onclick = () => setState({ view:"start" });
  return wrap;
}

function renderAdmin(){
  const data = state.adminData || [];
  const passCount = data.filter(r => r.passed).length;
  const rows = data.map(r => {
    const when = r.time ? new Date(r.time).toLocaleString("vi-VN") : "—";
    return `<tr>
      <td>${esc(r.name)||"—"}</td><td>${esc(r.dept)||"—"}</td>
      <td>${r.score}/${r.total}</td>
      <td><span class="badge ${r.passed?"pass":"fail"}">${r.passed?"ĐẠT":"CHƯA ĐẠT"}</span></td>
      <td>${when}</td>
    </tr>`;
  }).join("");
  const wrap = el(`
    <div>
      <div style="display:flex;justify-content:flex-end;"><button class="btn-ghost" id="refresh-btn" style="padding:6px 12px;font-size:12.5px;">Làm mới</button></div>
      <p class="kicker">Admin</p>
      <h1>Kết quả kiểm tra</h1>
      <p class="lede">${data.length} người đã làm bài · ${passCount} người đạt.</p>
      <div class="card" style="overflow-x:auto;">
        ${data.length ? `<table style="width:100%;border-collapse:collapse;font-size:13px;">
          <thead><tr style="text-align:left;color:var(--ink-muted);font-size:12px;">
            <th style="padding:8px 7px;border-bottom:1px solid var(--line);">Họ tên</th>
            <th style="padding:8px 7px;border-bottom:1px solid var(--line);">Phòng ban</th>
            <th style="padding:8px 7px;border-bottom:1px solid var(--line);">Điểm</th>
            <th style="padding:8px 7px;border-bottom:1px solid var(--line);">Kết quả</th>
            <th style="padding:8px 7px;border-bottom:1px solid var(--line);">Thời gian nộp</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>` : `<p class="lede" style="margin:0;">Chưa có ai nộp kết quả.</p>`}
      </div>
      ${state.adminError ? `<p class="lede" style="color:var(--bad);">${esc(state.adminError)}</p>` : ""}
      <button class="btn-ghost" id="admin-back">Quay lại trang chính</button>
    </div>
  `);
  wrap.querySelector("#refresh-btn").onclick = fetchAdminData;
  wrap.querySelector("#admin-back").onclick = () => setState({ view:"start" });
  return wrap;
}

/* ---------- result + certificate ---------- */
function renderResult(){
  const sc = score();
  const passed = sc >= PASS_THRESHOLD;
  const wrap = el(`
    <div>
      <p class="kicker">Kết quả</p>
      <h1>Chào ${esc(state.name)}!</h1>
      <div class="card">
        <label>Điểm số</label>
        <div class="result-score">${sc}/${QUIZ.length}</div>
        <span class="badge ${passed?"pass":"fail"}">${passed?"✓ ĐẠT":"CHƯA ĐẠT"}</span>
        <p class="lede" style="margin-top:14px;">${passed
          ? "Chúc mừng bạn đã hoàn thành bài kiểm tra Outlook &amp; Office 365. Chứng chỉ của bạn đã sẵn sàng bên dưới."
          : `Bạn cần tối thiểu ${PASS_THRESHOLD}/${QUIZ.length} câu đúng để đạt. Hãy ôn lại tài liệu đào tạo và thử lại.`}</p>
        <div style="margin-top:16px;"><button class="btn-ghost" id="review-btn">Xem lại đáp án</button></div>
        <div id="review-area"></div>
      </div>
    </div>
  `);
  wrap.querySelector("#review-btn").onclick = () => {
    const area = wrap.querySelector("#review-area");
    if (area.childElementCount){ area.innerHTML=""; return; }
    QUIZ.forEach((q,qi) => {
      const ok = state.answers[qi]===q.correct;
      area.appendChild(el(`
        <div style="padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;">
          <span style="color:${ok?"var(--good)":"var(--bad)"};font-weight:600;">${ok?"✓":"✗"}</span>
          ${qi+1}. ${esc(q.q)}${ok?"":" — Đáp án đúng: "+esc(q.opts[q.correct])}
        </div>
      `));
    });
  };

  if (passed){
    wrap.appendChild(el(`<h2 style="margin-top:26px;">Chứng chỉ của bạn</h2>`));
    const certOuter = el(`<div class="cert-outer"></div>`);
    certOuter.appendChild(buildCertificate(state.name, state.dept, sc));
    wrap.appendChild(certOuter);
    setTimeout(fitCertificate, 0);
    const dlRow = el(`<div style="text-align:center;"><button class="btn-gold" id="dl-btn">⬇ Tải chứng chỉ (PNG)</button></div>`);
    wrap.appendChild(dlRow);
    wrap.appendChild(el(`<p class="cert-note">Nếu ảnh tải về bị lệch, hãy thử lại sau khi trang đã tải xong hoàn toàn.</p>`));
    dlRow.querySelector("#dl-btn").onclick = () => downloadCertificate(state.name);
  } else {
    const retry = el(`<div style="text-align:center;margin-top:18px;"><button class="btn-primary" id="retry-btn">Làm lại bài kiểm tra</button></div>`);
    retry.querySelector("#retry-btn").onclick = () => setState({ view:"start", answers:{} });
    wrap.appendChild(retry);
  }
  return wrap;
}

function buildCertificate(name, dept, sc){
  const box = el(`
    <div class="certificate" id="certificate-node">
      <svg class="cert-svg" viewBox="0 0 900 636" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#F3C77C"/>
            <stop offset="100%" stop-color="#B97E22"/>
          </linearGradient>
          <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1B3A78"/>
            <stop offset="100%" stop-color="#0B1936"/>
          </linearGradient>
        </defs>
        <path d="M660,0 H900 V636 H430 C560,636 420,300 660,0 Z" fill="url(#goldGrad)"/>
        <path d="M685,0 H900 V636 H460 C580,636 440,290 685,0 Z" fill="url(#navyGrad)"/>
      </svg>
      <div class="cert-border"></div>
      <div class="cert-content">
        <img class="cert-logo" src="data:image/png;base64,${LOGO_B64}" alt="The Sentry">
        <p class="cert-kicker">CERTIFICATE</p>
        <p class="cert-sub">OF ACHIEVEMENT</p>
        <p class="cert-name">${esc(name)}</p>
        <p class="cert-desc">This certifies that the above named has successfully completed the
        <strong>Outlook &amp; Office 365</strong> training program and passed the assessment
        with a score of <strong>${sc}/${QUIZ.length}</strong>.</p>
        <div class="cert-meta-row">
          <div class="cert-meta"><div class="lbl">DATE</div><div class="val">${todayStr()}</div></div>
          <div class="cert-meta"><div class="lbl">ISSUED BY</div><div class="val">IT Department</div></div>
        </div>
      </div>
      <div class="cert-ribbon"><div class="tri tri-l"></div><div class="tri tri-r"></div></div>
      <div class="cert-seal"><div class="ic">✓</div><div class="txt">PASSED</div></div>
    </div>
  `);
  return box;
}

function fitCertificate(){
  const outer = document.querySelector(".cert-outer");
  const node = document.getElementById("certificate-node");
  if (!outer || !node) return;
  const scale = outer.clientWidth / 900;
  node.style.transform = "scale(" + scale + ")";
  node.dataset.scale = scale;
}
window.addEventListener("resize", fitCertificate);

function downloadCertificate(name){
  const node = document.getElementById("certificate-node");
  if (!node || typeof html2canvas === "undefined"){
    alert("Không thể tạo ảnh lúc này, vui lòng thử lại.");
    return;
  }
  const clone = node.cloneNode(true);
  clone.id = "certificate-export-clone";
  clone.style.transform = "none";
  clone.style.position = "fixed";
  clone.style.top = "0";
  clone.style.left = "-9999px";
  document.body.appendChild(clone);
  html2canvas(clone, { scale:2, backgroundColor:"#ffffff", width:900, height:636 }).then(canvas => {
    document.body.removeChild(clone);
    const link = document.createElement("a");
    link.download = "Certificate-" + (name.replace(/\s+/g,"-")||"Outlook") + ".png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  }).catch(() => { if (clone.parentNode) document.body.removeChild(clone); });
}

render();
</script>
</body>
</html>
